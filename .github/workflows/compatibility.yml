name: Compatibility Test

on:
  push:
    branches: [master, tidb-8.5-20261028-v8.5.7]
  pull_request:
    branches: [master, tidb-8.5-20261028-v8.5.7]

permissions:
  contents: read

jobs:
  tidb-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Checkout Client-Go
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: client-go

      - name: Checkout TiDB
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: pingcap/tidb
          ref: ${{ (github.base_ref || github.ref_name) == 'tidb-8.5-20261028-v8.5.7' && 'release-8.5-20260715-v8.5.7' || '' }}
          path: tidb

      - name: Check build
        run: |
          go mod edit -replace=github.com/tikv/client-go/v2=../client-go
          go mod tidy
          make server
        working-directory: tidb

      - name: Checkout go-ycsb
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: pingcap/go-ycsb
          path: go-ycsb

      - name: Check build
        run: |
          go mod edit -replace=github.com/tikv/client-go/v2=../client-go
          go mod tidy
          go build cmd/go-ycsb/*
        working-directory: go-ycsb
