name: Compatibility Test

on:
  push:
    branches: [master, "feature/*", "release-nextgen-*"]

permissions:
  contents: read

jobs:
  tidb-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Checkout Client-Go
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: client-go

      - name: Checkout TiDB
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: pingcap/tidb
          ref: ${{ startsWith(github.ref_name, 'release-nextgen-') && github.ref_name || '' }}
          path: tidb

      - name: Check build
        run: |
          go mod edit -replace=github.com/tikv/client-go/v2=../client-go
          go mod tidy
          make server
        working-directory: tidb

      - name: Checkout go-ycsb
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: pingcap/go-ycsb
          path: go-ycsb

      - name: Check build
        run: |
          go mod edit -replace=github.com/tikv/client-go/v2=../client-go
          go mod tidy
          go build cmd/go-ycsb/*
        working-directory: go-ycsb
